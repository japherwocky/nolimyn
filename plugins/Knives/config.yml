knife1:
  craft_amount: 5 # Integer
  max_amount: 50 # Integer
  damage: 2.0 # Double
  cooldown: 500 # Integer In milliseconds
  name: "<red>Iron Throwing Knife" # String
  lore: # List<String>
    - "A sharp knife"
  material: IRON_SWORD # Material as enum (for a list of possibilities see https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html)
  recipe: > # 2x2 or 3x3 grid of materials separated by '|'. '#' is an empty cell.
    # | # | # |
    # | IRON_INGOT | # |
    STICK | # | # |
knife2:
  craft_amount: 5
  max_amount: 50
  damage: 1.7
  cooldown: 300
  name: "<red>Copper Throwing Knife"
  lore: # List<String>
    - "A copper knife"
  material: COPPER_SWORD
  mass: .6 # This is a factor defining how fast objects fall. Best to keep it between 0.3 and 3.
  recipe: >
    # | # | # |
    # | COPPER_INGOT | # |
    STICK | # | # |
